[project]
name = "token-shield"
version = "0.2.0"
description = "Deterministic context optimizer, ChatGPT/Codex plugin MCP server, and optional OpenAI-compatible proxy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "pydantic-settings>=2.6,<3",
  "tiktoken>=0.8,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
token-shield-mcp = "app.mcp_server:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
